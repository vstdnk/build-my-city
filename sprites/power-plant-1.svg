<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <!-- Ветряк-электростанция: башенка с лопастями и знаком молнии -->
  <g stroke="#7d4d28" stroke-width="1.6" stroke-linejoin="round">
    <!-- стены -->
    <polygon points="14,74 48,94 48,118 14,98" fill="#fff1d8"/>
    <polygon points="48,94 82,74 82,98 48,118" fill="#e6d0ac"/>
    <!-- крыша -->
    <polygon points="8,72 48,94 48,44 8,60" fill="#8fd0e8"/>
    <polygon points="48,94 88,72 88,60 48,44" fill="#5ea9c9"/>
    <polygon points="8,60 48,38 88,60 48,44" fill="#b3e4f5"/>
    <!-- дверь -->
    <polygon points="26,90 40,98 40,112 26,104" fill="#a8663a"/>
  </g>
  <!-- лопасти -->
  <g stroke="#7d4d28" stroke-width="1.4" stroke-linejoin="round">
    <polygon points="48,30 52,16 44,16" fill="#fffaf0"/>
    <polygon points="52,32 66,38 66,30" fill="#fffaf0"/>
    <polygon points="44,32 30,38 30,30" fill="#fffaf0"/>
    <circle cx="48" cy="32" r="4" fill="#ffc73c"/>
  </g>
  <!-- знак молнии -->
  <polygon points="60,78 54,88 58,88 54,98 64,86 59,86 63,78" fill="#ffc73c" stroke="#b97c14" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
