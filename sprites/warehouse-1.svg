<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <!-- Амбар-склад: деревянные стены, рыжая крыша, ящик у входа -->
  <g stroke="#7d4d28" stroke-width="1.6" stroke-linejoin="round">
    <!-- стены -->
    <polygon points="12,70 48,92 48,118 12,96" fill="#f0d3a4"/>
    <polygon points="48,92 84,70 84,96 48,118" fill="#d8b57f"/>
    <!-- крыша -->
    <polygon points="4,68 48,92 48,38 4,56" fill="#f0b95e"/>
    <polygon points="48,92 92,68 92,56 48,38" fill="#d19640"/>
    <polygon points="4,56 48,32 92,56 48,38" fill="#ffd587"/>
    <!-- ворота -->
    <polygon points="24,88 42,98 42,112 24,102" fill="#a8663a"/>
    <!-- ящик -->
    <polygon points="58,96 66,100 66,110 58,106" fill="#e0b477"/>
    <polygon points="66,100 74,96 74,106 66,110" fill="#c9974f"/>
    <polygon points="58,96 66,92 74,96 66,100" fill="#f3d5a6"/>
  </g>
</svg>
